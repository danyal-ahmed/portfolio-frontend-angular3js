<div
  class="border border-terminal-border bg-terminal-card rounded-lg p-4 font-mono text-sm max-w-2xl mx-auto shadow-2xl"
>
  <!-- Terminal Header Bar -->
  <div
    class="flex items-center justify-between pb-3 border-b border-terminal-border text-terminal-muted mb-4"
  >
    <div class="flex items-center space-x-2">
      <!-- <span class="w-3 h-3 rounded-full bg-red-500/80 inline-block"></span>
      <span class="w-3 h-3 rounded-full bg-yellow-500/80 inline-block"></span>
      <span class="w-3 h-3 rounded-full bg-green-500/80 inline-block"></span> -->
      <span class="ml-2 text-xs text-terminal-muted">~/ask-me.sh</span>
    </div>
    <span class="text-xs text-green-400 flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> system connected
    </span>
  </div>

  <!-- Quick prompts -->
  <div class="text-xs text-light">ask anything or click a preset:</div>
  <div class="flex flex-wrap gap-2 mb-4">
    @for (prompt of presets; track prompt) {
      <button
        (click)="selectPrompt(prompt)"
        class="text-xs bg-terminal-border/50 hover:bg-terminal-border text-gray-300 px-2.5 py-1 rounded transition-colors"
      >
        {{ prompt }}
      </button>
    }
  </div>

  <!-- Chat History Log -->
  <div class="space-y-3 mb-4 max-h-60 overflow-y-auto">
    <!-- <div class="text-gray-400 text-xs">ready. // system connected to akkila.dev</div> -->
    @for (msg of history(); track $index) {
      <div [class]="msg.sender === 'user' ? 'text-green-400' : 'text-light'">
        <span class="mr-2">{{ msg.sender === 'user' ? '›' : '◆' }}</span>
        <span class="whitespace-pre-wrap">{{ msg.text }}</span>
      </div>
    }
  </div>

  <!-- Input Form -->
  <form
    (submit)="handleSubmit($event)"
    class="flex items-center gap-2 pt-2 border-t border-terminal-border"
  >
    <span class="text-green-400 font-bold">›</span>
    <input
      type="text"
      [(ngModel)]="currentInput"
      name="query"
      placeholder="Type a question..."
      class="bg-transparent flex-1 outline-none text-gray-100 placeholder-terminal-muted text-sm"
    />
    <span class="text-xs text-terminal-muted hidden sm:inline">press ↵</span>
  </form>
</div>
