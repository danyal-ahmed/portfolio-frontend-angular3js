<!-- Main page -->
<main
  class="relative z-10 min-h-screen bg-slate-950 text-slate-50 antialiased selection:bg-indigo-500 selection:text-white"
>
  <!-- Interactive background -->
  <app-background-avatar />

  <!-- Header -->
  <header class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md">
    <div class="mx-auto flex w-full items-center justify-between px-3 py-4 sm:px-4">
      <div class="font-mono text-lg font-bold tracking-tight text-indigo-400">
        portfolio<span class="text-slate-100">.io</span>
      </div>

      <nav class="flex items-center gap-6 text-sm font-medium text-slate-400">
        <a href="#projects" class="transition hover:text-white">&gt; Projects</a>
        <a href="#contact" class="transition hover:text-white">&gt; Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main content: 8 columns + 4 columns -->
  <div
    class="grid w-full grid-cols-1 items-start gap-x-2 gap-y-4 px-2 py-4 sm:px-3 md:grid-cols-12 px-3 py-2 md:px-4"
  >
    <!-- Left: Projects -->
    <section class="min-w-0 md:col-span-8">
      <div id="projects">
        <app-projects />
      </div>

      <section id="contact" class="mt-6">
        <!-- Contact content -->
      </section>
    </section>

    <!-- Right: Terminal -->
    <aside class="min-w-0 md:col-span-4 md:sticky md:top-20">
      <app-terminal />
    </aside>
  </div>
</main>
