<!-- Main page -->
<main
  class="relative z-10 min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-green-500 selection:text-slate-950"
>
  <!-- Interactive background -->
  <app-background-avatar />

  <!-- Header -->
  <app-header />

  <!-- Main content: 7 columns + 5 columns -->
  <!-- 1. Expanded max-width and reduced side paddings -->
  <div
    class="mx-auto grid w-full max-w-[90rem] grid-cols-1 items-start gap-x-4 gap-y-8 px-2 py-8 md:grid-cols-12 md:px-4 lg:px-6"
  >
    <!-- Left: Dynamic Routed Content -->
    <!-- 2. Reduced from col-span-8 to col-span-7 to yield space to the terminal -->
    <section class="min-w-0 md:col-span-7 flex flex-col min-h-[calc(100vh-8rem)]">
      <div class="flex-1 w-full pb-20">
        <router-outlet />
      </div>
    </section>

    <!-- Right: Terminal -->
    <!-- 3. Increased from col-span-4 to col-span-5 to make it wider -->
    <aside class="min-w-0 md:col-span-5 md:sticky md:top-24 self-start">
      <app-terminal />
    </aside>
  </div>
</main>
