<!-- Background Interactive Avatar -->

<main
  class="min-h-screen bg-slate-950 text-slate-50 antialiased selection:bg-indigo-500 selection:text-white relative z-10"
>
  <app-background-avatar />
  <!-- Header -->
  <header class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
      <div class="font-mono text-lg font-bold tracking-tight text-indigo-400">
        portfolio<span class="text-slate-100">.io</span>
      </div>

      <nav class="flex items-center gap-6 text-sm font-medium text-slate-400">
        <a href="#projects" class="transition hover:text-white"> &gt; Projects </a>
        <a href="#contact" class="transition hover:text-white"> &gt; Contact </a>
      </nav>
    </div>
  </header>

  <!-- Main layout -->
  <div
    class="mx-auto grid max-w-7xl grid-cols-1 items-start gap-3 px-2 py-3 lg:grid-cols-[minmax(0,1fr)_minmax(0,2fr)_minmax(280px,1fr)]"
  >
    <!-- Left: Sticky profile -->
    <aside class="min-w-0 lg:sticky lg:top-28">
      <section class="mb-6">
        <h1 class="mb-2 text-2xl font-bold tracking-tight text-white">Danyal Ahmed</h1>

        <p class="text-sm leading-6 text-slate-400">
          Full Stack Developer &amp; AI Engineer based in Karachi, Pakistan.
        </p>
      </section>
    </aside>

    <!-- Center: Scrollable page content -->
    <section class="min-w-0">
      <div id="projects" class="mb-8">
        <app-projects />
      </div>

      <section id="contact" class="py-8">
        <!-- Add your contact component here -->
      </section>
    </section>

    <!-- Right: Sticky terminal -->
    <aside class="min-w-0 lg:sticky lg:top-28">
      <app-terminal />
    </aside>
  </div>
</main>
