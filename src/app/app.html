<!-- GLOBAL BACKGROUND & OVERLAY (Applies to ALL routes) -->
<div class="fixed inset-0 bg-slate-950 -z-10"></div>

<!-- 1. GLOBAL BACKGROUND (3JS Canvas sits over the dark background) -->
<app-background-avatar />

<!-- 2. DYNAMIC GLASS OVERLAY (Pure Blur, sits over the canvas) -->
<div
  class="fixed inset-0 pointer-events-none transition-all duration-700 z-[1]"
  [class.backdrop-blur-3xl]="isFocusMode()"
  [class.backdrop-blur-none]="!isFocusMode()"
></div>

<!-- Floating Toggle Button with Full-Width Magical Pulse -->
<button
  (click)="toggleFocusMode()"
  class="fixed bottom-6 left-6 z-50 flex items-center gap-2 px-4 py-2.5 rounded-lg border transition-all duration-300 font-mono text-xs uppercase tracking-widest shadow-lg group hover:-translate-y-0.5 cursor-pointer"
  [class]="
    isFocusMode()
      ? 'bg-slate-900/80 border-slate-700 text-slate-400 hover:text-slate-200 hover:border-slate-500 backdrop-blur-sm'
      : 'bg-black/40 border-green-500/50 text-green-400 hover:bg-black/60 hover:border-green-400 backdrop-blur-sm'
  "
>
  <!-- Full-Button Ripple Glow (Pings safely every 4 seconds) -->
  <span
    class="absolute inset-0 rounded-lg ring-2 ring-green-400/40 bg-green-400/10 animate-ping pointer-events-none"
    style="animation-duration: 4s"
  ></span>

  <span class="text-green-500 group-hover:animate-pulse relative z-10">❯</span>
  <span class="relative z-10">{{ isFocusMode() ? './view_3d.sh' : './read_mode.sh' }}</span>
</button>

<!-- ROUTER VIEW AREA -->
@if (isAdminRoute()) {
  <!-- Admin Area: Now sitting on top of the global background -->
  <router-outlet />
} @else {
  <!-- Public Area -->
  <main
    class="relative z-10 min-h-screen text-slate-100 antialiased selection:bg-green-500 selection:text-slate-950"
  >
    <!-- Header -->
    <app-header />

    <!-- Main content grid: 7 columns + 5 columns -->
    <div
      class="mx-auto grid w-full max-w-[90rem] grid-cols-1 items-start gap-x-4 gap-y-8 px-2 py-8 md:grid-cols-12 md:px-4 lg:px-6 relative z-10"
    >
      <!-- Left: Dynamic Routed Content -->
      <section class="min-w-0 md:col-span-7 flex flex-col min-h-[calc(100vh-8rem)]">
        <div class="flex-1 w-full pb-20">
          <router-outlet />
        </div>
      </section>

      <!-- Right: Chatbot Terminal -->
      <aside class="min-w-0 md:col-span-5 md:sticky md:top-24 self-start">
        <app-terminal />
      </aside>
    </div>
  </main>
}
