<!-- Main page -->
<main
  class="relative z-10 min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white"
>
  <!-- Interactive background -->
  <app-background-avatar />

  <!-- Header -->
  <app-header />

  <!-- Main content: 8 columns + 4 columns -->
  <div
    class="grid w-full grid-cols-1 items-start gap-x-2 gap-y-4 px-2 py-4 sm:px-3 md:grid-cols-12 px-3 py-2 md:px-4"
  >
    <!-- Left: Projects -->
    <section class="min-w-0 md:col-span-8">
      <div id="projects">
        <router-outlet />
      </div>
    </section>

    <!-- Right: Terminal -->
    <aside class="min-w-0 md:col-span-4 md:sticky md:top-50">
      <app-terminal />
    </aside>
  </div>
</main>
